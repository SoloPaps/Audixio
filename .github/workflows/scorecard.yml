name: scorecard

# Note de sécurité du dépôt (OpenSSF Scorecard, /10) avec la liste de ce qui manque.
# Résultats dans l'onglet Security (Code scanning, catégorie « scorecard »).
on:
  branch_protection_rule:
  schedule:
    - cron: '30 5 * * 3'
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # publier dans l'onglet Security
      id-token: write # publier la note (OpenSSF)
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Publier dans l'onglet Security
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: results.sarif
          category: scorecard
