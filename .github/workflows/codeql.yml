name: codeql

# Analyse de sécurité en profondeur (suivi des données jusqu'aux endroits
# dangereux). Les alertes apparaissent dans l'onglet Security et sur les PR.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1' # chaque lundi : nouvelles règles
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # publier les alertes
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Init CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: javascript-typescript
          # Jeu de règles le plus large : sécurité étendue + qualité.
          queries: security-extended,security-and-quality
          # Maquettes HTML, fixtures et tests : pas du code livré.
          config: |
            paths-ignore:
              - docs/**
              - fixtures/**
              - '**/test/**'
              - '**/*.test.ts'
              - '**/e2e/**'

      - name: Analyse
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:javascript-typescript
