name: dependency-review

# Bloque une PR qui introduit une dépendance avec une faille connue (gravité haute ou plus).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  review:
    name: Revue des dépendances
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
