name: ci

# push limité à main : une PR ne lance pas à la fois push et pull_request.
# pull_request pose le check requis « check » sur la PR (forks compris).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Les vérifications tournent en parallèle ; « check » (check requis) les attend
  # toutes, applique les corrections automatiques et échoue si une seule échoue.
  statique:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: statique
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: guard
        run: pnpm guard

      - name: lint
        if: ${{ !cancelled() }}
        run: pnpm lint

      - name: copy-lint
        if: ${{ !cancelled() }}
        run: pnpm copy-lint

      - name: typecheck
        if: ${{ !cancelled() }}
        run: pnpm typecheck

      - name: Deno
        if: ${{ !cancelled() }}
        run: |
          curl -fsSL -o /tmp/deno.zip https://github.com/denoland/deno/releases/download/v2.5.6/deno-x86_64-unknown-linux-gnu.zip
          sudo unzip -o /tmp/deno.zip -d /usr/local/bin

      - name: edge
        if: ${{ !cancelled() }}
        run: |
          deno check --sloppy-imports --no-lock netlify/edge-functions/auth-guard.ts
          deno bundle --sloppy-imports --no-lock netlify/edge-functions/auth-guard.ts -o /tmp/audixio-auth-guard.js

  unitaires:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: unitaires
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Supabase CLI
        run: |
          curl -fsSL -o /tmp/supabase.tar.gz https://github.com/supabase/cli/releases/download/v2.122.0/supabase_linux_amd64.tar.gz
          sudo tar -xzf /tmp/supabase.tar.gz -C /usr/local/bin

      - name: Supabase local
        run: supabase start --yes -x realtime,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      # browser-runner et la CLI lancent Chromium dans leurs tests unitaires.
      - name: Chromium
        run: pnpm --filter @audigy/web exec playwright install --with-deps chromium

      - name: test
        run: pnpm test

  # Le propriétaire lance la suite sous Windows : tests unitaires sans
  # Supabase local (pas de Docker sur l’hôte Windows), Chromium compris.
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    name: unitaires (Windows)
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Chromium
        run: pnpm --filter @audigy/web exec playwright install chromium

      - name: test
        env:
          AUDIGY_SANS_SUPABASE: '1'
        run: pnpm test

  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    name: publication
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Supabase CLI
        run: |
          curl -fsSL -o /tmp/supabase.tar.gz https://github.com/supabase/cli/releases/download/v2.122.0/supabase_linux_amd64.tar.gz
          sudo tar -xzf /tmp/supabase.tar.gz -C /usr/local/bin

      - name: Supabase local
        run: supabase start --yes -x realtime,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Chromium
        run: pnpm --filter @audigy/web exec playwright install --with-deps chromium

      - name: build
        run: pnpm build

      - name: self-audit
        if: ${{ !cancelled() }}
        run: pnpm self-audit

      - name: test:a11y
        if: ${{ !cancelled() }}
        run: pnpm test:a11y

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    name: ui (${{ matrix.shard }}/4)
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Supabase CLI
        run: |
          curl -fsSL -o /tmp/supabase.tar.gz https://github.com/supabase/cli/releases/download/v2.122.0/supabase_linux_amd64.tar.gz
          sudo tar -xzf /tmp/supabase.tar.gz -C /usr/local/bin

      - name: Supabase local
        run: supabase start --yes -x realtime,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Chromium
        run: pnpm --filter @audigy/web exec playwright install --with-deps chromium

      # Certains tests UI lisent dist/ (poids de l’accueil, cadran).
      - name: build
        run: pnpm build

      - name: test:ui (web, part ${{ matrix.shard }}/4)
        run: pnpm --filter @audigy/web exec playwright test --shard=${{ matrix.shard }}/4

      - name: test:ui (browser-runner)
        if: ${{ matrix.shard == 1 && !cancelled() }}
        run: pnpm --filter @audigy/browser-runner run test:ui

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: check
    needs: [statique, unitaires, windows, publication, ui]
    if: ${{ always() }}
    permissions:
      contents: write # pousser knip et Biome ; le jeton par défaut ne relance pas les workflows
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          # Même dépôt : branche de tête, pour y pousser un correctif.
          # Fork : commit de fusion, le jeton ne peut pas pousser.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || github.sha }}

      - name: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Auto-fix autorisé
        id: gate
        env:
          ACTOR: ${{ github.actor }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          fix=false
          if [[ "$REF" != "refs/heads/main" && "$ACTOR" != "dependabot[bot]" && "$AUTHOR" != "dependabot[bot]" ]]; then
            if [[ "$EVENT_NAME" != "pull_request" || "$HEAD_REPO" == "$REPO" ]]; then
              fix=true
            fi
          fi
          echo "run=$fix" >> "$GITHUB_OUTPUT"

      # Corrections sûres. Jamais sur main, jamais pour dependabot[bot]
      # (jeton en lecture seule : le push échoue), jamais depuis un fork.
      # knip : exports et types inutilisés seulement. Un échec ne bloque pas.
      - name: Auto-fix (knip, exports inutilisés)
        if: steps.gate.outputs.run == 'true'
        run: pnpm dlx knip@5 --fix --fix-type exports,types || true

      - name: Auto-fix (Biome)
        if: steps.gate.outputs.run == 'true'
        run: pnpm format

      - name: Commit des corrections
        id: autofix
        if: steps.gate.outputs.run == 'true'
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7
        with:
          commit_message: "chore: corrections automatiques (knip, Biome)"
          branch: ${{ github.head_ref || github.ref_name }}
          file_pattern: ". :!.github/workflows"
          token: ${{ github.token }}

      # Ce push ne déclenche ni push ni pull_request. Sans cet échec, HEAD
      # n'a pas le check requis « check » et la PR reste bloquée.
      - name: Refuser un HEAD sans check
        if: steps.autofix.conclusion == 'success' && steps.autofix.outputs.changes_detected == 'true'
        run: |
          echo "::error title=Check requis absent::Un commit automatique a été poussé avec le jeton par défaut. Ce jeton ne relance pas les workflows : le check requis « check » n'est pas posé sur le nouveau commit. Poussez à nouveau pour le lancer (git commit --allow-empty -m 'ci: relance les checks' && git push). Aucun secret n'est requis. Jeton d'application facultatif : docs/dev/GITHUB-SETUP.md."
          exit 1

      - name: Résumé
        if: always()
        env:
          RESULTS: >-
            statique=${{ needs.statique.result }}
            unitaires=${{ needs.unitaires.result }}
            windows=${{ needs.windows.result }}
            publication=${{ needs.publication.result }}
            ui=${{ needs.ui.result }}
        run: |
          failed=0
          for r in $RESULTS; do
            echo "$r"
            case "$r" in *=success) ;; *) failed=1 ;; esac
          done
          exit $failed

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: e2e
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Supabase CLI
        run: |
          curl -fsSL -o /tmp/supabase.tar.gz https://github.com/supabase/cli/releases/download/v2.122.0/supabase_linux_amd64.tar.gz
          sudo tar -xzf /tmp/supabase.tar.gz -C /usr/local/bin

      - name: Supabase local
        run: supabase start --yes -x realtime,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Chromium
        run: pnpm --filter @audigy/web exec playwright install --with-deps chromium

      - name: Netlify CLI
        # Version et dépendances figées par .github/netlify-cli/package-lock.json.
        run: |
          npm ci --prefix .github/netlify-cli --no-audit --no-fund
          echo "$GITHUB_WORKSPACE/.github/netlify-cli/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Parcours
        run: pnpm test:e2e
