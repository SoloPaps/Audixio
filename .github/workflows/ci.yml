name: ci

# push limité à main : une PR ne lance pas à la fois push et pull_request.
# pull_request pose le check requis « check » sur la PR (forks compris).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: check
    permissions:
      contents: write # pousser knip et Biome ; le jeton par défaut ne relance pas les workflows
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          # Même dépôt : branche de tête, pour y pousser un correctif.
          # Fork : commit de fusion, le jeton ne peut pas pousser.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || github.sha }}

      - name: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Auto-fix autorisé
        id: gate
        env:
          ACTOR: ${{ github.actor }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          fix=false
          if [[ "$REF" != "refs/heads/main" && "$ACTOR" != "dependabot[bot]" && "$AUTHOR" != "dependabot[bot]" ]]; then
            if [[ "$EVENT_NAME" != "pull_request" || "$HEAD_REPO" == "$REPO" ]]; then
              fix=true
            fi
          fi
          echo "run=$fix" >> "$GITHUB_OUTPUT"

      # Corrections sûres. Jamais sur main, jamais pour dependabot[bot]
      # (jeton en lecture seule : le push échoue), jamais depuis un fork.
      # knip : exports et types inutilisés seulement. Un échec ne bloque pas.
      - name: Auto-fix (knip, exports inutilisés)
        if: steps.gate.outputs.run == 'true'
        run: pnpm dlx knip@5 --fix --fix-type exports,types || true

      - name: Auto-fix (Biome)
        if: steps.gate.outputs.run == 'true'
        run: pnpm format

      - name: Commit des corrections
        id: autofix
        if: steps.gate.outputs.run == 'true'
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7
        with:
          commit_message: "chore: corrections automatiques (knip, Biome)"
          branch: ${{ github.head_ref || github.ref_name }}
          file_pattern: ". :!.github/workflows"
          token: ${{ github.token }}

      # Ce push ne déclenche ni push ni pull_request. Sans cet échec, HEAD
      # n'a pas le check requis « check » et la PR reste bloquée.
      - name: Refuser un HEAD sans check
        if: steps.autofix.conclusion == 'success' && steps.autofix.outputs.changes_detected == 'true'
        run: |
          echo "::error title=Check requis absent::Un commit automatique a été poussé avec le jeton par défaut. Ce jeton ne relance pas les workflows : le check requis « check » n'est pas posé sur le nouveau commit. Poussez à nouveau pour le lancer (git commit --allow-empty -m 'ci: relance les checks' && git push). Aucun secret n'est requis. Jeton d'application facultatif : docs/dev/GITHUB-SETUP.md."
          exit 1

      - name: Supabase CLI
        run: |
          curl -fsSL -o /tmp/supabase.tar.gz https://github.com/supabase/cli/releases/download/v2.122.0/supabase_linux_amd64.tar.gz
          sudo tar -xzf /tmp/supabase.tar.gz -C /usr/local/bin

      - name: Supabase local
        run: supabase start --yes -x realtime,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Chromium
        run: pnpm --filter @audigy/web exec playwright install --with-deps chromium

      # Chaque vérification s'exécute même si une précédente échoue.
      - name: guard
        id: guard
        continue-on-error: true
        run: pnpm guard

      - name: lint
        id: lint
        continue-on-error: true
        run: pnpm lint

      - name: copy-lint
        id: copy_lint
        continue-on-error: true
        run: pnpm copy-lint

      - name: typecheck
        id: typecheck
        continue-on-error: true
        run: pnpm typecheck

      - name: test
        id: test
        continue-on-error: true
        run: pnpm test

      - name: build
        id: build
        continue-on-error: true
        run: pnpm build

      - name: self-audit
        id: self_audit
        continue-on-error: true
        run: pnpm self-audit

      - name: test:ui
        id: test_ui
        continue-on-error: true
        run: pnpm test:ui

      - name: test:a11y
        id: test_a11y
        continue-on-error: true
        run: pnpm test:a11y

      - name: Résumé
        if: always()
        env:
          RESULTS: >-
            guard=${{ steps.guard.outcome }}
            lint=${{ steps.lint.outcome }}
            copy-lint=${{ steps.copy_lint.outcome }}
            typecheck=${{ steps.typecheck.outcome }}
            test=${{ steps.test.outcome }}
            build=${{ steps.build.outcome }}
            self-audit=${{ steps.self_audit.outcome }}
            test:ui=${{ steps.test_ui.outcome }}
            test:a11y=${{ steps.test_a11y.outcome }}
        run: |
          failed=0
          for r in $RESULTS; do
            echo "$r"
            case "$r" in *=failure) failed=1 ;; esac
          done
          exit $failed
