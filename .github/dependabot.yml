# Mises à jour automatiques par PR. Chaque PR doit réussir le CI avant merge :
# c'est ce qui permet de corriger sans rien casser.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Attend 7 jours après une publication avant de proposer la mise à jour.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
    # Groupes séparés pour que l'auto-merge ne voie qu'un seul type de bump.
    # minimatch : override racine vers 11.0.3 (GHSA-g3hv-75wg-m249).
    # glob@13 (@sentry/bundler-plugins) borne minimatch en ^10 ; Dependabot
    # ne peut pas résoudre 11.0.1 tout seul (security_update_not_possible).
    groups:
      patch:
        update-types: [patch]
      minor-dev:
        dependency-type: development
        update-types: [minor]
      minor-prod:
        dependency-type: production
        update-types: [minor]
    ignore:
      # `astro check` (apps/web) ne gère pas encore TypeScript 7 : apps/web reste en 6.x.
      # À retirer quand Astro prend en charge TypeScript 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # @types/node doit suivre la version de Node utilisée (.nvmrc : 22).
      # La 26 décrit des API de Node 26 et casse le typecheck (JsonWebKey, etc.).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      actions:
        patterns: ["*"]
